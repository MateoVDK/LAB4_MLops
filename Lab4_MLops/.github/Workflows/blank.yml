name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Check out code repository
        uses: actions/checkout@v4

      - name: Build local Docker image
        run: docker build -t hello-world-nginx:v1 ./LAB4_MLops

      - name: Remove old container if it exists
        run: docker rm -f test-container || true


      - name: Run Docker container
        run: docker run -d -p 8080:80 --name test-container hello-world-nginx:v1

      - name: Show running containers
        run: docker ps

      - name: Show container logs
        run: docker logs test-container

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image for GitHub Packages
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/hello-world-nginx:${{ github.ref_name }} \
                       -t ghcr.io/${{ github.repository_owner }}/hello-world-nginx:${{ github.sha }} \
                       ./LAB4_MLops

      - name: Push branch tag
        run: docker push ghcr.io/${{ github.repository_owner }}/hello-world-nginx:${{ github.ref_name }}

      - name: Push commit tag
        run: docker push ghcr.io/${{ github.repository_owner }}/hello-world-nginx:${{ github.sha }}
